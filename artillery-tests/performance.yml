config:
  target: "http://127.0.0.1:5000"  # Replace with your actual API URL
  phases:
    - duration: 30
      arrivalRate: 5  # Start with 5 requests per second
      name: "Warm-up Phase"
    - duration: 60
      arrivalRate: 10  # Ramp up from 10 to 50 requests/sec
      rampTo: 50
      name: "Load Test Phase"
    - duration: 30
      arrivalRate: 50  # Stress test at 50 requests/sec
      name: "Stress Test Phase"
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  - name: Test - Longer Waiting Time Patients
    flow:
      - get:
          url: "/pms/longer_waiting_time"
          expect:
            - statusCode: 200  # Expect success

  - name: Test - Show Patient Progress
    flow:
      - get:
          url: "/pms/show_progress?patient_id=123"
          expect:
            - statusCode: 200  # Ensure patient data is returned

  - name: Test - Ask a question
    flow:
      - get:
          url: "/qms/ask_question"
          expect:
            - statusCode: 200  # Ensure patient data is returned

  - name: Test - View Questions
    flow:
      - get:
          url: "/qms/view_questions"
          expect:
            - statusCode: 200  # Ensure patient data is returned

  - name: Test - Give Reply to Question
    flow:
      - get:
          url: "/qms/reply_question"
          expect:
            - statusCode: 200  # Ensure patients list is available
