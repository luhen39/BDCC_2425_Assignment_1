config:
  target: "http://127.0.0.1:5000"  # Replace with your actual API URL
  phases:
    - duration: 30  # Run for 30 seconds
      arrivalRate: 5  # Start with 5 requests per second
      name: "Warm-up Phase"
    - duration: 60  # Ramp up traffic gradually
      arrivalRate: 10  # Start at 10 requests/sec
      rampTo: 50  # Increase to 50 requests/sec
      name: "Load Test Phase"
    - duration: 30  # High-load test
      arrivalRate: 50  # 50 requests/sec
      name: "Stress Test Phase"
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  - name: Performance Test - Longer Waiting Time Patients
    flow:
      - get:
          url: "/pms/longer_waiting_time"
          expect:
            - statusCode: 200  # Ensure the response is successful
