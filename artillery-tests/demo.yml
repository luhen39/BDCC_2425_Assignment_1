config:
  target: "http://127.0.0.1:5000"  # Change this to your actual API URL
  phases:
    - duration: 5
      arrivalRate: 2  # Send 2 requests per second for 10 seconds
      name: "Health Check Phase"

scenarios:
  - name: "Test - Add Admission"
    flow:
      - post:
          url: "/pms/add_admission"
          formData:
            patient_id: "123"  # Replace with a valid patient ID
            admission_time: "2025-03-23T10:00:00Z"
            discharge_time: "2025-03-24T10:00:00Z"
            admission_type: "Emergency"
            diagnosis: "Chest Pain"
          expect:
            - statusCode: 302  # Expect a redirect after successfully adding admission
            - headers:
                Location: "/pms/show_admissions?patient_id=123"  # Redirect to the show admissions page
