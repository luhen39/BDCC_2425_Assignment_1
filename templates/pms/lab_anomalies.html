<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Anomalies</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Lab Anomalies</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Patient ID</th>
                <th>Lab Item ID</th>
                <th>Chart Time</th>
                <th>Value</th>
                <th>Z-Score</th>
            </tr>
        </thead>
        <tbody>
            {% for anomaly in anomalies %}
            <tr>
                <td>{{ anomaly.SUBJECT_ID }}</td>
                <td>{{ anomaly.ITEMID }}</td>
                <td>{{ anomaly.CHARTTIME }}</td>
                <td>{{ anomaly.VALUENUM }}</td>
                <td>{{ anomaly.Z_SCORE }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <br>
    <a href="/">Back to Main Page</a>
</body>
</html>
