<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Questions Section</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <h1>Questions Section</h1>

    <!-- Back to Main Page Button -->
    <a href="/"><button>Back to Main Page</button></a>

    <!-- Link to Ask a Question -->
    <a href="/qms/ask_question"><button>Ask a Question</button></a>

    <!-- Form to View Questions for a Patient -->
    <h2>View Questions for a Patient</h2>
    <form action="/qms/view_questions" method="GET">
      <label for="patient_id">Patient ID:</label>
      <input type="number" id="patient_id" name="patient_id" required />
      <button type="submit">View Questions</button>
    </form>
  </body>
</html>
