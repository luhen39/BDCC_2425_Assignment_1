<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Show Patients</title>
  </head>
  <body>
    <h2>Patient List</h2>
    <ul>
      {% for patient in patients %}
      <li>
        ID: {{ patient.SUBJECT_ID }}, Gender: {{ patient.GENDER }}, DOB: {{
        patient.DOB }}, DOD: {{ patient.DOD or 'N/A' }}
      </li>
      {% endfor %}
    </ul>

    <button onclick="location.href='/'">Back to Main Page</button>
  </body>
</html>
