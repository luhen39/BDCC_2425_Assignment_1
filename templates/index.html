<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <h1>Hospital Management System</h1>

    <h2>Patient Management System</h2>

    <!-- Patient Management Buttons -->
    <button onclick="location.href='/pms/add_patient'">Add Patient</button>
    <button onclick="location.href='/pms/show_patients'">Show Patients</button>
    <button onclick="location.href='/pms/edit_patient'">Edit Patient</button>
    <button onclick="location.href='/pms/delete_patient'">Delete Patient</button>
    <button onclick="location.href='/pms/longer_waiting_time'">Longer Waiting Time</button>

    <!-- Form to input patient_id for admissions -->
    <h3>View Admissions for a Patient</h3>
    <form action="/pms/show_admissions" method="GET">
      <label for="patient_id">Patient ID:</label>
      <input type="number" id="patient_id" name="patient_id" required />
      <button type="submit">Show Admissions</button>
    </form>

    <!-- Form to input patient_id for progress -->
    <h3>View Progress for a Patient</h3>
    <form action="/pms/show_progress" method="GET">
      <label for="patient_id">Patient ID:</label>
      <input type="number" id="patient_id" name="patient_id" required />
      <button type="submit">Show Progress</button>
    </form>

    <h2>Media Management System</h2>
    
    <!-- Media Management Buttons -->
    <button onclick="location.href='/mms/upload_media'">Upload Media</button>
    <button onclick="location.href='/mms/download_media'">Download Media</button>
    <button onclick="location.href='/mms/show_media'">Show Media</button>
    <button onclick="location.href='/mms/edit_media'">Edit Media</button>
    <button onclick="location.href='/mms/delete_media'">Delete Media</button>

    <!-- Big Rectangle Button for Questions Section -->
    <div onclick="location.href='/qms/questions'" class="questions-button">
      Questions Section
    </div>
  </body>
</html>
