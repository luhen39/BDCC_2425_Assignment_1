<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Questions</title>
</head>

<body>
    <h2>Ask a Question</h2>
    <form id="questionForm">
        <label for="patient_id">Patient ID:</label>
        <input type="number" id="patient_id" name="patient_id" required /><br />

        <label for="question_text">Question:</label>
        <textarea id="question_text" name="question_text" required></textarea><br />

        <button type="submit">Submit Question</button>
    </form>
    <button onclick="location.href='/'">Back to Main Page</button>

    <script>
        document.getElementById("questionForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const patientId = document.getElementById("patient_id").value;
            const questionText = document.getElementById("question_text").value;

            const response = await fetch("/questions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ patient_id: parseInt(patientId), question_text: questionText })
            });

            const result = await response.json();
            alert(result.message || "Question submitted!");
        });
    </script>
</body>

</html>
