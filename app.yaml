runtime: python39

entrypoint: gunicorn -b :$PORT src.main:app # Caminho para o arquivo `main.py` na pasta `src`

# Increase instance class to F2 (256 MB) or higher
instance_class: F4

# Configure automatic scaling
automatic_scaling:
  target_cpu_utilization: 0.65  # Target CPU utilization (65%)
  max_concurrent_requests: 10    # Maximum concurrent requests per instance
  max_pending_latency: 15s       # Maximum latency before spinning up new instances (valid range: [0.01, 15.0])
  min_pending_latency: 10s       # Minimum latency before spinning down instances
  max_instances: 5               # Maximum number of instances
  min_instances: 1               # Minimum number of instances

handlers:
  # This configures Google App Engine to serve the files in the app's static
  # directory.
  - url: /static
    static_dir: static

  # This handler routes all requests not caught above to your main app. It is
  # required when static routes are defined, but can be omitted (along with
  # the entire handlers section) when there are no static files defined.
  - url: /.*
    script: auto

env_variables:
  GOOGLE_CLOUD_PROJECT: "bdcp-201705314" # Substitua pelo ID do projeto GCP

# Enable App Engine APIs
app_engine_apis: true