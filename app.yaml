runtime: python39

entrypoint: gunicorn -b :$PORT src.main:app

instance_class: F1  # Use F1 if you want to stay in the free tier

automatic_scaling:
  target_cpu_utilization: 0.75
  max_concurrent_requests: 50
  max_pending_latency: 15s  # Keep it at max allowed
  min_pending_latency: 5s  # Valid range: [0.01, 15.0]
  max_instances: 3
  min_instances: 0


handlers:
  - url: /static
    static_dir: static
  - url: /.*
    script: auto

env_variables:
  GOOGLE_CLOUD_PROJECT: "bdcp-201705314"  # Replace with your project ID
